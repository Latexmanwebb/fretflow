name: Bug report
description: Report a reproducible problem with FretFlow.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and read docs/KNOWN_ISSUES.md first. Do not share credentials, private scores, or microphone recordings. For vulnerabilities, follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release version or commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS version, hardware, browser/version or desktop app.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the starting state, actions, and score format. Use a minimal example you have permission to share.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant errors, screenshots, or logs after removing personal information.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround or additional context
