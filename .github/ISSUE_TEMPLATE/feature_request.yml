name: Feature request
description: Suggest an improvement to guitar practice.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and read docs/ROADMAP.md first. Focus on the practice problem and the outcome you want.
  - type: textarea
    id: problem
    attributes:
      label: What practice problem would this solve?
      description: Describe when it occurs and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the workflow you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples or sketches you have permission to share.
